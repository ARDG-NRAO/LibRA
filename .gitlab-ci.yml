# =============================================================================
# Container Build Jobs (production pipeline)
# Run on existing shell runner against rootless Docker.
# Staged: base (no arch) -> deps (arch matrix) -> components (arch matrix) -> tests (arch matrix)
# Each stage only fires when its inputs change, or when FORCE_CONTAINER=true.
# VOLTA70 builds automatically on changes; AMPERE80/HOPPER90 are manual
# (when: manual, allow_failure: true) on the container-production branch,
# triggered from the pipeline UI when needed.
# Requires GitLab CI variables: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# Images are tagged by arch only — no :latest to avoid ambiguity.
# =============================================================================

.container-common:
  stage: container
  cache: []
  variables:
    DOCKERHUB_ORG: "ardgnrao"
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    # buildx with docker-container driver is required for registry-mode cache export
    - docker buildx create --use --name libra-builder --driver docker-container 2>/dev/null || docker buildx use libra-builder
    - docker buildx inspect --bootstrap
    - git submodule sync
    - git submodule update --init --recursive

# base is per-arch because CUDA version compatibility is arch-dependent:
#   volta70  -> cuda 12.9.1   (V100 max supported)
#   ampere80 -> cuda 13.0.0
#   hopper90 -> cuda 13.0.0
container-base:
  extends: .container-common
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "container-production" && $CUDA_ARCH != "VOLTA70"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CUDA_ARCH == "VOLTA70"'
      changes:
        - scripts/container_recipes/CI/Dockerfile.base
        - scripts/container_recipes/CI/readline.pc
    - if: '$CI_COMMIT_BRANCH == "main" && $CUDA_ARCH == "VOLTA70"'
      changes:
        - scripts/container_recipes/CI/Dockerfile.base
        - scripts/container_recipes/CI/readline.pc
    - if: '$CI_COMMIT_BRANCH == "container-production" && $CUDA_ARCH == "VOLTA70"'
      changes:
        - scripts/container_recipes/CI/Dockerfile.base
        - scripts/container_recipes/CI/readline.pc
    - if: '$FORCE_CONTAINER == "true"'
    - when: never
  parallel:
    matrix:
      - CUDA_ARCH: VOLTA70
        CUDA_VERSION: "12.9.1"
      - CUDA_ARCH: AMPERE80
        CUDA_VERSION: "13.0.0"
      - CUDA_ARCH: HOPPER90
        CUDA_VERSION: "13.0.0"
  script:
    - ARCH_TAG=$(echo ${CUDA_ARCH} | tr '[:upper:]' '[:lower:]')
    - |
      time docker buildx build \
        --build-arg CUDA_VERSION=${CUDA_VERSION} \
        --cache-from type=registry,ref=${DOCKERHUB_ORG}/libra-base:${ARCH_TAG}-buildcache \
        --cache-to type=registry,ref=${DOCKERHUB_ORG}/libra-base:${ARCH_TAG}-buildcache,mode=max \
        -f scripts/container_recipes/CI/Dockerfile.base \
        -t ${DOCKERHUB_ORG}/libra-base:${ARCH_TAG} \
        -t ${DOCKERHUB_ORG}/libra-base:${ARCH_TAG}-${CI_COMMIT_SHORT_SHA} \
        --push \
        .

# deps is arch-specific — one job per arch via parallel matrix
container-deps:
  extends: .container-common
  needs:
    - job: container-base
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "container-production" && $CUDA_ARCH != "VOLTA70"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CUDA_ARCH == "VOLTA70"'
      changes:
        - scripts/container_recipes/CI/Dockerfile.deps
    - if: '$CI_COMMIT_BRANCH == "main" && $CUDA_ARCH == "VOLTA70"'
      changes:
        - scripts/container_recipes/CI/Dockerfile.deps
    - if: '$CI_COMMIT_BRANCH == "container-production" && $CUDA_ARCH == "VOLTA70"'
      changes:
        - scripts/container_recipes/CI/Dockerfile.deps
    - if: '$FORCE_CONTAINER == "true"'
    - when: never
  parallel:
    matrix:
      - CUDA_ARCH: [VOLTA70, AMPERE80, HOPPER90]
  script:
    - ARCH_TAG=$(echo ${CUDA_ARCH} | tr '[:upper:]' '[:lower:]')
    - |
      time docker buildx build \
        --build-arg BASE_IMAGE=${DOCKERHUB_ORG}/libra-base:${ARCH_TAG} \
        --build-arg CUDA_ARCH=${CUDA_ARCH} \
        --build-arg nproc=8 \
        --cache-from type=registry,ref=${DOCKERHUB_ORG}/libra-deps:${ARCH_TAG}-buildcache \
        --cache-to type=registry,ref=${DOCKERHUB_ORG}/libra-deps:${ARCH_TAG}-buildcache,mode=max \
        -f scripts/container_recipes/CI/Dockerfile.deps \
        -t ${DOCKERHUB_ORG}/libra-deps:${ARCH_TAG} \
        -t ${DOCKERHUB_ORG}/libra-deps:${ARCH_TAG}-${CI_COMMIT_SHORT_SHA} \
        --push \
        scripts/container_recipes/CI/

# components pulls the arch-matched deps image
container-components:
  extends: .container-common
  needs:
    - job: container-deps
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "container-production" && $CUDA_ARCH != "VOLTA70"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CUDA_ARCH == "VOLTA70"'
      changes:
        - src/**/*
        - apps/**/*
        - cmake/**/*
        - CMakeLists.txt
        - scripts/container_recipes/CI/Dockerfile.components
    - if: '$CI_COMMIT_BRANCH == "main" && $CUDA_ARCH == "VOLTA70"'
      changes:
        - src/**/*
        - apps/**/*
        - cmake/**/*
        - CMakeLists.txt
        - scripts/container_recipes/CI/Dockerfile.components
    - if: '$CI_COMMIT_BRANCH == "container-production" && $CUDA_ARCH == "VOLTA70"'
      changes:
        - src/**/*
        - apps/**/*
        - cmake/**/*
        - CMakeLists.txt
        - scripts/container_recipes/CI/Dockerfile.components
    - if: '$FORCE_CONTAINER == "true"'
    - when: never
  parallel:
    matrix:
      - CUDA_ARCH: [VOLTA70, AMPERE80, HOPPER90]
  script:
    - ARCH_TAG=$(echo ${CUDA_ARCH} | tr '[:upper:]' '[:lower:]')
    - |
      time docker buildx build \
        --build-arg nproc=8 \
        --build-arg BASE_IMAGE=${DOCKERHUB_ORG}/libra-deps:${ARCH_TAG} \
        --cache-from type=registry,ref=${DOCKERHUB_ORG}/libra-components:${ARCH_TAG}-buildcache \
        --cache-to type=registry,ref=${DOCKERHUB_ORG}/libra-components:${ARCH_TAG}-buildcache,mode=max \
        -f scripts/container_recipes/CI/Dockerfile.components \
        -t ${DOCKERHUB_ORG}/libra-components:${ARCH_TAG} \
        -t ${DOCKERHUB_ORG}/libra-components:${ARCH_TAG}-${CI_COMMIT_SHORT_SHA} \
        --push \
        scripts/container_recipes/CI/

# tests pulls the arch-matched components image
container-tests:
  extends: .container-common
  needs:
    - job: container-components
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "container-production" && $CUDA_ARCH != "VOLTA70"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CUDA_ARCH == "VOLTA70"'
      changes:
        - scripts/container_recipes/CI/Dockerfile.tests
        - apps/src/tests/**/*
        - libra-python/tests/**/*
    - if: '$CI_COMMIT_BRANCH == "main" && $CUDA_ARCH == "VOLTA70"'
      changes:
        - scripts/container_recipes/CI/Dockerfile.tests
        - apps/src/tests/**/*
        - libra-python/tests/**/*
    - if: '$CI_COMMIT_BRANCH == "container-production" && $CUDA_ARCH == "VOLTA70"'
      changes:
        - scripts/container_recipes/CI/Dockerfile.tests
        - apps/src/tests/**/*
        - libra-python/tests/**/*
    - if: '$FORCE_CONTAINER == "true"'
    - when: never
  parallel:
    matrix:
      - CUDA_ARCH: [VOLTA70, AMPERE80, HOPPER90]
  script:
    - ARCH_TAG=$(echo ${CUDA_ARCH} | tr '[:upper:]' '[:lower:]')
    - |
      time docker buildx build \
        --build-arg BASE_IMAGE=${DOCKERHUB_ORG}/libra-components:${ARCH_TAG} \
        --cache-from type=registry,ref=${DOCKERHUB_ORG}/libra-tests:${ARCH_TAG}-buildcache \
        --cache-to type=registry,ref=${DOCKERHUB_ORG}/libra-tests:${ARCH_TAG}-buildcache,mode=max \
        -f scripts/container_recipes/CI/Dockerfile.tests \
        -t ${DOCKERHUB_ORG}/libra-tests:${ARCH_TAG} \
        -t ${DOCKERHUB_ORG}/libra-tests:${ARCH_TAG}-${CI_COMMIT_SHORT_SHA} \
        --push \
        scripts/container_recipes/CI/

# =============================================================================
# Deploy: repackages the already-tested libra-tests:volta70 image onto a slim
# CUDA runtime base (no compilers/headers/build tree). Only on a tag push.
# Pushes a single tag, libra:volta-release, no history kept.
# =============================================================================
deploy-release:
  extends: .container-common
  stage: deploy
  needs:
    - job: container-tests
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      time docker buildx build \
        --build-arg BASE_IMAGE=${DOCKERHUB_ORG}/libra-tests:volta70 \
        -f scripts/container_recipes/CI/Dockerfile.release \
        -t ${DOCKERHUB_ORG}/libra:volta-release \
        --push \
        scripts/container_recipes/CI/

