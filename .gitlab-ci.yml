workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "container-production"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_MESSAGE =~ /CI BUILD/'
    - if: '$CI_COMMIT_MESSAGE =~ /SPACK BUILD/'
    - if: '$FORCE_CI == "true"'
    - if: '$FORCE_SPACK == "true"'
    - if: '$FORCE_CONTAINER == "true"'
    - when: never

stages:
  - build
  - test
  - spack-test
  - container
  - deploy

variables:
  CCACHE_BASEDIR: $CI_PROJECT_DIR
  CCACHE_DIR: "${CI_BUILDS_DIR}/ccache"
  GIT_CLEAN_FLAGS: none

cache:
  - key: ccache-global
    paths:
      - $CCACHE_DIR
    policy: pull-push
  - key: spack-builds
    paths:
      - "${CI_BUILDS_DIR}/spack-cache"
    when: on_success

